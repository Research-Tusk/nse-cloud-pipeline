name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/take_rates.py'
      - 'vercel.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check take rates match between Python and /api/revenue
        run: python3 scripts/check_take_rates.py

      - name: Trigger Vercel deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: Summary
        run: |
          echo "### Dashboard Deploy Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date +%Y-%m-%d\ %H:%M\ UTC)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Vercel deploy hook fired" >> $GITHUB_STEP_SUMMARY
